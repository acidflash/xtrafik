<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-trafik Realtidskarta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    /* ── Design tokens ──────────────────────────────────────────── */
    :root {
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --shadow-panel: 0 2px 12px oklch(0% 0 0 / 0.12), 0 1px 3px oklch(0% 0 0 / 0.08);

      --color-accent:       oklch(42% 0.14 260);
      --color-accent-hover: oklch(36% 0.14 260);
      --color-accent-ring:  oklch(65% 0.14 260 / 0.2);

      --color-text:        oklch(22% 0.01 260);
      --color-text-muted:  oklch(52% 0.01 260);
      --color-surface:     oklch(99% 0.005 260);
      --color-border:      oklch(88% 0.008 260);
      --color-row-divider: oklch(93% 0.005 260);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      color: var(--color-text);
    }

    #map { height: 100vh; }

    /* ── Shared panel shell ─────────────────────────────────────── */
    .panel {
      background: var(--color-surface);
      box-shadow: var(--shadow-panel);
      border-radius: var(--radius-lg);
    }

    /* Leaflet applies its own to .info – override */
    .info {
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-surface);
      box-shadow: var(--shadow-panel);
      border-radius: var(--radius-lg);
    }

    /* ── Panel label (overline style) ───────────────────────────── */
    .panel-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      margin: 0 0 var(--sp-1);
    }

    /* ── Info panel ─────────────────────────────────────────────── */
    .info-count {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--color-text);
      line-height: 1;
    }
    .info-sub {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-top: var(--sp-1);
    }

    /* ── Bus markers ────────────────────────────────────────────── */
    .bus-icon-new { display: block; }
    .leaflet-zoom-animated { will-change: transform; }

    /* ── Filter panel ───────────────────────────────────────────── */
    .filter-control {
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-surface);
      box-shadow: var(--shadow-panel);
      border-radius: var(--radius-lg);
      width: 200px;
    }

    .filter-input {
      display: block;
      width: 100%;
      margin-top: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      color: var(--color-text);
      background: white;
      outline: none;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    .filter-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-ring);
    }
    .filter-input::placeholder { color: var(--color-text-muted); }

    .filter-buttons {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-2);
    }

    .btn-primary {
      flex: 1;
      padding: var(--sp-2) var(--sp-3);
      background: var(--color-accent);
      color: oklch(99% 0 0);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 150ms ease-out, transform 100ms ease-out;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      padding: var(--sp-2) var(--sp-3);
      background: transparent;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 150ms ease-out, color 150ms ease-out, transform 100ms ease-out;
    }
    .btn-ghost:hover {
      border-color: oklch(68% 0.01 260);
      color: var(--color-text);
    }
    .btn-ghost:active { transform: scale(0.97); }

    /* ── Layer control ──────────────────────────────────────────── */
    .leaflet-control-layers {
      box-shadow: var(--shadow-panel) !important;
      border-radius: var(--radius-lg) !important;
      border: none !important;
    }
    .leaflet-control-layers-expanded {
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-surface);
      border-radius: var(--radius-lg) !important;
      font-family: inherit;
      font-size: 13px;
      color: var(--color-text);
    }

    /* ── Legend ─────────────────────────────────────────────────── */
    .legend {
      max-height: 45vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* ── Mobile filter FAB ──────────────────────────────────────── */
    .filter-fab {
      display: none;
      position: fixed;
      bottom: 48px;
      right: var(--sp-4);
      z-index: 1000;
    }
    .filter-fab-btn {
      width: 48px;
      height: 48px;
      background: var(--color-accent);
      color: white;
      border: none;
      border-radius: 50%;
      box-shadow: 0 3px 14px oklch(0% 0 0 / 0.28);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 120ms ease-out, transform 100ms ease-out;
      position: relative;
    }
    .filter-fab-btn:hover  { background: var(--color-accent-hover); }
    .filter-fab-btn:active { transform: scale(0.93); }
    .filter-fab-btn.has-filter::after {
      content: '';
      position: absolute;
      top: 9px; right: 9px;
      width: 8px; height: 8px;
      background: oklch(62% 0.19 25);
      border-radius: 50%;
      border: 2px solid white;
    }

    /* ── Mobile filter sheet ────────────────────────────────────── */
    .filter-sheet {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: 0 -4px 24px oklch(0% 0 0 / 0.15);
      padding: var(--sp-2) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom, 0px));
      z-index: 1001;
      transform: translateY(100%);
      transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    .filter-sheet.open { transform: translateY(0); }
    .filter-sheet-handle {
      width: 36px; height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      margin: 0 auto var(--sp-3);
    }

    /* ── Mobile overrides ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .legend { display: none; }
      .filter-control { display: none !important; }
      .filter-fab, .filter-sheet { display: block; }

      /* Dölj alla panel-etiketter i Leaflet-kontroller */
      .leaflet-control .panel-label { display: none; }

      /* Kompakta info-panelen – ta bort titeln, minska padding */
      .info .panel-label { display: none; }
      .info { padding: var(--sp-2) var(--sp-3) !important; }
      .info-count { font-size: 22px; }

      /* Större touch-yta för lokalisera-knappen */
      .locate-control a {
        width: 36px !important;
        height: 36px !important;
      }
    }
    .legend::-webkit-scrollbar { width: 4px; }
    .legend::-webkit-scrollbar-track { background: transparent; }
    .legend::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 2px;
    }

    /* ── Update indicator ───────────────────────────────────────── */
    .update-indicator {
      font-size: 11px;
      color: var(--color-text-muted);
      transition: background-color 200ms ease-out, color 200ms ease-out;
      min-width: 180px;
    }
    .update-indicator.flash {
      background: oklch(96% 0.04 90 / 0.95);
      color: var(--color-text);
    }

    /* ── Versionsstämpel ────────────────────────────────────────── */
    #versionBadge {
      position: fixed;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      color: oklch(55% 0.005 260);
      background: oklch(99% 0.005 260 / 0.75);
      padding: 1px 5px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 1000;
      font-family: inherit;
      backdrop-filter: blur(2px);
    }

    /* ── Linjemarkering (dimma ej-valda bussar) ─────────────────── */
    .bus-icon-new { transition: opacity 200ms ease-out, filter 200ms ease-out; }
    .bus-icon-new.dimmed { opacity: 0.15; filter: grayscale(80%); }

    /* ── Popup ──────────────────────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow-panel) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
    }
    .leaflet-popup-tip-container { margin-top: -1px; }

    .popup-wrapper {
      min-width: 210px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .popup-header {
      padding: var(--sp-3) var(--sp-4);
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .popup-long-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-align: center;
      padding: 0 var(--sp-4) var(--sp-2);
      margin: 0;
    }
    .popup-body {
      padding: var(--sp-2) var(--sp-4) var(--sp-3);
    }
    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-2) 0;
      gap: var(--sp-3);
    }
    .popup-row + .popup-row {
      border-top: 1px solid var(--color-row-divider);
    }
    .popup-row-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .popup-row-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
      text-align: right;
    }

    /* ── Locate control ─────────────────────────────────────────── */
    .locate-control a {
      width: 26px !important;
      height: 26px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      color: #333;
      text-decoration: none;
      transition: color 120ms ease-out;
    }
    .locate-control a:hover { color: var(--color-accent); }
    .locate-control a.locating { color: var(--color-accent); animation: pulse-icon 1s ease-in-out infinite; }
    @keyframes pulse-icon { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Accessibility ──────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .update-indicator,
      .btn-primary,
      .btn-ghost,
      .filter-input { transition: none; }
      .locate-control a.locating { animation: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="versionBadge">Version: –</div>

  <!-- Mobilt filter: FAB-knapp + bottom sheet -->
  <div class="filter-fab">
    <button class="filter-fab-btn" id="filterFabBtn" aria-label="Filtrera bussar" title="Filtrera bussar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
        <line x1="11" y1="18" x2="13" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="filter-sheet" id="filterSheet">
    <div class="filter-sheet-handle"></div>
    <div class="panel-label">Filtrera efter linje</div>
    <input class="filter-input" type="text" id="lineFilterMobile"
           placeholder="Linjenummer, t.ex. 1" autocomplete="off" inputmode="numeric"/>
    <div class="filter-buttons" style="margin-top:var(--sp-2);">
      <button id="applyFilterMobile" class="btn-primary">Sök</button>
      <button id="clearFilterMobile" class="btn-ghost">Rensa</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([60.6749, 17.1413], 10);

    // ── Base map layers ──────────────────────────────────────────
    const baseMaps = {
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }),
      "OpenTopoMap": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenTopoMap contributors'
      }),
      "Esri WorldImagery": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }),
      "CyclOSM": L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
        attribution: '&copy; CyclOSM contributors'
      })
    };

    const savedLayer = localStorage.getItem('preferredMapLayer') || "OpenStreetMap";
    baseMaps[savedLayer].addTo(map);

    const layerControl = L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
    const layerTitle = document.createElement('div');
    layerTitle.innerHTML = '<div class="panel-label" style="margin-bottom:8px;">Kartstilar</div>';
    layerControl.getContainer().insertBefore(layerTitle, layerControl.getContainer().firstChild);

    map.on('baselayerchange', e => localStorage.setItem('preferredMapLayer', e.name));

    // ── Locate control ───────────────────────────────────────────
    const LocateControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd() {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control locate-control');
        const link = L.DomUtil.create('a', '', container);
        link.href = '#';
        link.title = 'Zooma till min position';
        link.setAttribute('role', 'button');
        link.setAttribute('aria-label', 'Zooma till min position');
        link.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        </svg>`;
        L.DomEvent.on(link, 'click', L.DomEvent.stop);
        L.DomEvent.on(link, 'click', () => locateUser(link));
        return container;
      }
    });
    new LocateControl().addTo(map);

    function locateUser(btn) {
      if (!navigator.geolocation) return;
      if (btn) btn.classList.add('locating');
      navigator.geolocation.getCurrentPosition(pos => {
        if (btn) btn.classList.remove('locating');
        map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        fetchData();
      }, () => {
        if (btn) btn.classList.remove('locating');
      }, { timeout: 10000 });
    }

    // ── State ────────────────────────────────────────────────────
    let markersGroup = L.layerGroup().addTo(map);
    let markersByRoute = {};
    let vehicleMarkers  = {};   // vehicleId → { marker, animFrame, lat, lng, seen }
    let vehicleRouteMap = {};   // vehicleId → routeKey (för linjemarkering)
    let legend = L.control({ position: 'bottomright' });
    let activeFilter     = '';
    let highlightedRoute = null;
    let isFetching       = false;
    let nextFetchAt      = 0;
    let busLines = new Set();
    let moveDebounce = null;

    // ── Positionsanimering ───────────────────────────────────────
    // Interpolerar en markör från nuvarande position till ny position
    // under ~14 s (lite kortare än poll-intervallet på 15 s).
    function animateMarker(entry, toLat, toLng) {
      if (entry.animFrame) cancelAnimationFrame(entry.animFrame);

      const fromLat = entry.lat;
      const fromLng = entry.lng;
      const dist = Math.abs(toLat - fromLat) + Math.abs(toLng - fromLng);

      // Hoppa direkt om bussen teleporterat (>500 m ungefär)
      if (dist > 0.005) {
        entry.marker.setLatLng([toLat, toLng]);
        entry.lat = toLat;
        entry.lng = toLng;
        return;
      }

      const DURATION = 14000; // ms
      const startTime = performance.now();

      function step(now) {
        const t = Math.min((now - startTime) / DURATION, 1);
        // ease-out cubic
        const e = 1 - Math.pow(1 - t, 3);
        const lat = fromLat + (toLat - fromLat) * e;
        const lng = fromLng + (toLng - fromLng) * e;
        entry.marker.setLatLng([lat, lng]);
        if (t < 1) entry.animFrame = requestAnimationFrame(step);
        else { entry.lat = toLat; entry.lng = toLng; entry.animFrame = null; }
      }

      entry.animFrame = requestAnimationFrame(step);
    }

    // ── Colour map (fallback när GTFS saknar färger) ─────────────
    const busColors = {
      '1':  '#00796B',
      '2':  '#D32F2F',
      '3':  '#7B1FA2',
      '4':  '#FBC02D',
      '10': '#1976D2',
      '11': '#388E3C',
      '12': '#F57C00',
      '15': '#5D4037',
      'default': '#1c65b0'
    };

    function getBusColor(busNumber, routeColor) {
      if (routeColor && routeColor.startsWith('#') && routeColor !== '#000000') return routeColor;
      return busColors[busNumber] || busColors['default'];
    }

    // ── Info panel ───────────────────────────────────────────────
    let info = L.control({ position: 'topleft' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info');
      this.update(0);
      return this._div;
    };
    info.update = function (count, filtered = false, loading = false) {
      if (loading) {
        this._div.innerHTML = `
          <div class="panel-label">X-trafik Realtid</div>
          <div class="info-sub" style="margin-top:4px;">Laddar fordon&hellip;</div>`;
      } else if (count !== null) {
        this._div.innerHTML = `
          <div class="panel-label">X-trafik Realtid</div>
          <div class="info-count">${count}</div>
          <div class="info-sub">fordon i vyn${filtered ? ' &nbsp;·&nbsp; filtrerat' : ''}</div>`;
      } else {
        this._div.innerHTML = `
          <div class="panel-label">X-trafik Realtid</div>
          <div class="info-sub" style="margin-top:4px;">Laddar fordon&hellip;</div>`;
      }
    };
    info.addTo(map);

    // ── Filter control ───────────────────────────────────────────
    let filterControl = L.control({ position: 'topright' });
    filterControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'filter-control');
      div.innerHTML = `
        <div class="panel-label">Filtrera efter linje</div>
        <input class="filter-input" type="text" id="lineFilter"
               placeholder="Linjenummer, t.ex. 1" autocomplete="off" />
        <div class="filter-buttons">
          <button id="applyFilter" class="btn-primary">Sök</button>
          <button id="clearFilter" class="btn-ghost">Rensa</button>
        </div>`;
      return div;
    };
    filterControl.addTo(map);

    document.getElementById('applyFilter').addEventListener('click', () => {
      activeFilter = document.getElementById('lineFilter').value.trim();
      updateFabBadge();
      clearAllMarkers();
      fetchData();
    });

    document.getElementById('clearFilter').addEventListener('click', () => {
      activeFilter = '';
      document.getElementById('lineFilter').value = '';
      updateFabBadge();
      clearAllMarkers();
      fetchData();
    });

    document.getElementById('lineFilter').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        activeFilter = e.target.value.trim();
        updateFabBadge();
        clearAllMarkers();
        fetchData();
      }
    });

    document.querySelector('.filter-control').addEventListener('mousedown', e => e.stopPropagation());

    // ── Mobilt filter (FAB + bottom sheet) ──────────────────────
    const filterFabBtn = document.getElementById('filterFabBtn');
    const filterSheet  = document.getElementById('filterSheet');
    const lineFilterMobile = document.getElementById('lineFilterMobile');

    function updateFabBadge() {
      filterFabBtn.classList.toggle('has-filter', activeFilter !== '');
    }

    function openFilterSheet() {
      filterSheet.classList.add('open');
      lineFilterMobile.value = activeFilter;
      setTimeout(() => lineFilterMobile.focus(), 80);
    }

    function closeFilterSheet() {
      filterSheet.classList.remove('open');
    }

    filterFabBtn.addEventListener('click', () => {
      filterSheet.classList.contains('open') ? closeFilterSheet() : openFilterSheet();
    });

    document.getElementById('applyFilterMobile').addEventListener('click', () => {
      activeFilter = lineFilterMobile.value.trim();
      document.getElementById('lineFilter').value = activeFilter;
      updateFabBadge();
      clearAllMarkers();
      closeFilterSheet();
      fetchData();
    });

    document.getElementById('clearFilterMobile').addEventListener('click', () => {
      activeFilter = '';
      lineFilterMobile.value = '';
      document.getElementById('lineFilter').value = '';
      updateFabBadge();
      clearAllMarkers();
      closeFilterSheet();
      fetchData();
    });

    lineFilterMobile.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        activeFilter = e.target.value.trim();
        document.getElementById('lineFilter').value = activeFilter;
        updateFabBadge();
        clearAllMarkers();
        closeFilterSheet();
        fetchData();
      }
    });

    // Stäng sheet vid tryck utanför
    document.addEventListener('click', e => {
      if (filterSheet.classList.contains('open') &&
          !filterSheet.contains(e.target) &&
          !filterFabBtn.contains(e.target)) {
        closeFilterSheet();
      }
    });

    // ── Direction arrow – sticker ut från bussikonen ─────────────
    // Ikonen har en 64×64 container. Bussrutan (40×22) är centrerad i
    // containern (center = 32,32 = karmpositionen). Pilen roterar kring
    // containerns centrum och sticker ut i körriktningen.
    const ICON_SZ = 64;
    const BUS_W = 40, BUS_H = 22;
    const BUS_L = (ICON_SZ - BUS_W) / 2;   // 12
    const BUS_T = (ICON_SZ - BUS_H) / 2;   // 21
    const NUM_T = BUS_T - 12;              // 9

    // ── Legend ───────────────────────────────────────────────────
    function updateLegend(busLinesSet) {
      if (legend._map) map.removeControl(legend);
      if (busLinesSet.size < 2) return;

      const routeColors = {};
      Object.keys(markersByRoute).forEach(route => {
        const marker = markersByRoute[route]?.[0];
        const colorMatch = (marker?.options?.icon?.options?.html || '').match(/background-color:\s*([^;]+);/);
        if (colorMatch) routeColors[route] = colorMatch[1].trim();
      });

      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        div.innerHTML = '<div class="panel-label" style="margin-bottom:8px;">Busslinjer</div>';
        busLinesSet.forEach(line => {
          const color = routeColors[line] || getBusColor(line);
          div.innerHTML += `
            <div style="display:flex;align-items:center;gap:8px;padding:3px 0;">
              <div style="position:relative;flex-shrink:0;width:28px;height:16px;">
                <div style="width:28px;height:16px;background:${color};border-radius:4px;"></div>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:white;text-shadow:0 1px 2px rgba(0,0,0,0.4);">${line}</div>
              </div>
              <span style="font-size:12px;color:var(--color-text);">Linje ${line}</span>
            </div>`;
        });
        return div;
      };
      legend.addTo(map);
    }

    // ── Update indicator ─────────────────────────────────────────
    const updateIndicator = L.control({ position: 'bottomleft' });
    updateIndicator.onAdd = function () {
      const div = L.DomUtil.create('div', 'info update-indicator');
      div.textContent = 'Laddar…';
      return div;
    };
    updateIndicator.addTo(map);

    function flashUpdateIndicator() {
      const el = document.querySelector('.update-indicator');
      if (!el) return;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 800);
    }

    function setLastUpdatedTime() {
      const el = document.querySelector('.update-indicator');
      if (!el) return;
      el.dataset.lastUpdate = new Date().toLocaleTimeString('sv-SE', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }

    // Uppdatera nedräknings-/statusindikatorn varje sekund
    setInterval(() => {
      const el = document.querySelector('.update-indicator');
      if (!el || el.classList.contains('flash')) return;
      const secs = Math.max(0, Math.round((nextFetchAt - Date.now()) / 1000));
      const last = el.dataset.lastUpdate || '';
      el.textContent = last
        ? `Om ${secs} s  ·  Senast: ${last}`
        : 'Laddar…';
    }, 1000);

    // ── Linjemarkering ───────────────────────────────────────────
    function applyHighlight(routeKey) {
      highlightedRoute = routeKey;
      Object.entries(vehicleMarkers).forEach(([id, entry]) => {
        const el = entry.marker.getElement();
        if (!el) return;
        el.classList.toggle('dimmed', vehicleRouteMap[id] !== routeKey);
      });
    }

    function clearHighlight() {
      highlightedRoute = null;
      Object.values(vehicleMarkers).forEach(entry => {
        entry.marker.getElement()?.classList.remove('dimmed');
      });
    }

    map.on('click', clearHighlight);

    // ── Main fetch ───────────────────────────────────────────────
    async function fetchData() {
      if (isFetching) return;
      isFetching = true;
      try {
        busLines.clear();
        markersByRoute = {};

        // Skicka kartans aktuella vy som bounding box
        const b = map.getBounds();
        const bbox = [
          b.getSouth().toFixed(5), b.getWest().toFixed(5),
          b.getNorth().toFixed(5), b.getEast().toFixed(5)
        ].join(',');

        const data = await fetch(`/api/vehicles?bbox=${bbox}`).then(r => r.json());

        const vehicles = data.map(entity => {
          const v = { ...entity };
          const vehicleId = entity.vehicle?.id;

          if (!vehicleId) { v.busNumber = v.busNumber || '?'; return v; }

          const directMap = { '9031021000557753': '55' };
          if (directMap[vehicleId]) {
            v.busNumber = directMap[vehicleId];
          } else if (entity.busNumber && entity.busNumber !== 'Okänt') {
            // Backend (GTFS) resolved it
          } else if (vehicleId.length === 16) {
            const cid = vehicleId.substring(6, 10);
            const cmap = {
              '1000':'44','1001':'27','0005':'55','1002':'1','1003':'2',
              '1004':'3','1005':'4','1010':'10','1011':'11','1012':'12',
              '1015':'15','1020':'20','1030':'30','1041':'41','1042':'42',
              '1050':'50','0051':'51','0052':'52','0054':'54','0056':'56',
              '0057':'57','0058':'58','0059':'59'
            };
            if (cmap[cid]) {
              v.busNumber = cmap[cid];
            } else if (cid.startsWith('00')) {
              const n = cid.substring(2).replace(/^0+/, '');
              v.busNumber = (n && parseInt(n) > 0) ? n : '?';
            } else {
              v.busNumber = '?';
            }
          } else {
            v.busNumber = entity.busNumber || 'X';
          }

          return v;
        });

        // Linje 44 = tomkörning, linje 27 = paus/ej i trafik – dölj dessa
        const OUT_OF_SERVICE = new Set(['44', '27']);
        const activeVehicles = vehicles.filter(v => !OUT_OF_SERVICE.has(v.busNumber));

        const filtered = activeFilter
          ? activeVehicles.filter(v =>
              v.busNumber?.startsWith(activeFilter) || v.routeId === activeFilter
            )
          : activeVehicles;

        info.update(filtered.length, activeFilter !== '');

        filtered.forEach(vehicle => {
          if (!vehicle.position) return;

          const { latitude: lat, longitude: lon, speed: speedMs = 0, bearing = 0 } = vehicle.position;
          const speedKmh = Math.round(speedMs * 3.6);
          const routeKey = vehicle.busNumber || 'okänd';

          if (!markersByRoute[routeKey]) markersByRoute[routeKey] = [];
          if (vehicle.busNumber) busLines.add(vehicle.busNumber);

          const busColor = getBusColor(vehicle.busNumber, vehicle.routeColor);
          const textColor = vehicle.routeTextColor || '#FFFFFF';

          let tsValue;
          if (typeof vehicle.timestamp === 'number') {
            tsValue = vehicle.timestamp;
          } else if (vehicle.timestamp?.low !== undefined) {
            tsValue = vehicle.timestamp.low;
          } else {
            tsValue = Math.floor(Date.now() / 1000);
          }
          const timestamp = new Date(parseInt(tsValue) * 1000)
            .toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

          const displayNumber = vehicle.routeInfo?.shortName ||
            (vehicle.busNumber !== 'Okänt' ? vehicle.busNumber : null) ||
            'X-trafik';

          const speedText = speedKmh > 0 ? `${speedKmh} km/h` : 'Stillastående';

          // Popup
          let popup = `<div class="popup-wrapper">
            <div class="popup-header" style="background:${busColor};color:${textColor};">
              Linje ${displayNumber}
            </div>`;

          if (vehicle.routeLongName) {
            popup += `<p class="popup-long-name">${vehicle.routeLongName}</p>`;
          }

          popup += `<div class="popup-body">
            <div class="popup-row">
              <span class="popup-row-label">Hastighet</span>
              <span class="popup-row-value">${speedText}</span>
            </div>
            <div class="popup-row">
              <span class="popup-row-label">Uppdaterad</span>
              <span class="popup-row-value">${timestamp}</span>
            </div>`;

          if (vehicle.routeInfo?.agency) {
            popup += `<div class="popup-row">
              <span class="popup-row-label">Operatör</span>
              <span class="popup-row-value">${vehicle.routeInfo.agency}</span>
            </div>`;
          }

          popup += `</div></div>`;

          // Bus icon med utskjutande riktningspil
          const arrowHtml = bearing ? `
            <div style="position:absolute;inset:0;transform:rotate(${bearing}deg);pointer-events:none;z-index:5;">
              <svg style="position:absolute;top:2px;left:50%;transform:translateX(-50%);"
                   width="20" height="18" viewBox="0 0 20 18">
                <polygon points="10,0 20,18 0,18"
                         fill="${busColor}"
                         stroke="white" stroke-width="3" stroke-linejoin="round"/>
              </svg>
            </div>` : '';

          const busIcon = L.divIcon({
            html: `
              <div style="position:relative;width:${ICON_SZ}px;height:${ICON_SZ}px;">
                ${arrowHtml}
                <div style="position:absolute;left:${BUS_L}px;top:${BUS_T}px;
                  width:${BUS_W}px;height:${BUS_H}px;background-color:${busColor};
                  border:2px solid white;border-radius:6px;
                  box-shadow:0 2px 8px rgba(0,0,0,0.5);z-index:10;">
                  <div style="position:absolute;width:5px;height:5px;border-radius:50%;background:#222;bottom:-3px;left:7px;"></div>
                  <div style="position:absolute;width:5px;height:5px;border-radius:50%;background:#222;bottom:-3px;right:7px;"></div>
                </div>
                <div style="position:absolute;top:${NUM_T}px;left:50%;transform:translateX(-50%);
                  background:white;color:black;border:2px solid black;border-radius:12px;
                  padding:1px 6px;font-weight:bold;font-size:14px;z-index:20;
                  min-width:14px;text-align:center;box-shadow:0 0 4px rgba(0,0,0,0.8);
                  white-space:nowrap;">
                  ${displayNumber}
                </div>
              </div>`,
            className: 'bus-icon-new',
            iconSize: [ICON_SZ, ICON_SZ],
            iconAnchor: [ICON_SZ / 2, ICON_SZ / 2]
          });

          const vehicleId = vehicle.vehicle?.id || `${lat},${lon}`;
          const existing = vehicleMarkers[vehicleId];

          if (existing) {
            animateMarker(existing, lat, lon);
            existing.marker.setIcon(busIcon);
            existing.marker.setPopupContent(popup);
            existing.seen = true;
          } else {
            const marker = L.marker([lat, lon], { icon: busIcon, zIndexOffset: 1000 })
              .bindPopup(popup)
              .addTo(markersGroup);
            // Klick på buss → markera hela linjen
            marker.on('click', () => {
              if (highlightedRoute === routeKey) clearHighlight();
              else applyHighlight(routeKey);
            });
            vehicleMarkers[vehicleId] = { marker, animFrame: null, lat, lng: lon, seen: true };
          }

          vehicleRouteMap[vehicleId] = routeKey;
          markersByRoute[routeKey].push(vehicleMarkers[vehicleId].marker);
        });

        // Ta bort markörer för fordon som försvunnit från vyn
        Object.keys(vehicleMarkers).forEach(id => {
          const entry = vehicleMarkers[id];
          if (!entry.seen) {
            if (entry.animFrame) cancelAnimationFrame(entry.animFrame);
            markersGroup.removeLayer(entry.marker);
            delete vehicleMarkers[id];
          } else {
            entry.seen = false; // återställ inför nästa runda
          }
        });

        updateLegend(busLines);
        setLastUpdatedTime();

        // Återapplicera linjemarkering om en linje var vald
        if (highlightedRoute) applyHighlight(highlightedRoute);

        // Smart startvy: om inga fordon i vy och ingen aktiv filter,
        // zooma ut till hela regionen första gången
        if (filtered.length === 0 && !activeFilter && Object.keys(vehicleMarkers).length === 0) {
          map.setView([60.6749, 17.1413], 10);
        }

      } catch (err) {
        info.update(null, false);
        info._div.innerHTML += '<br><span style="color:#c0392b;font-size:12px;">Fel vid hämtning av data</span>';
      } finally {
        isFetching = false;
      }
    }

    // ── Rensa alla markörer (vid stor vyändring / filterändring) ──
    function clearAllMarkers() {
      Object.values(vehicleMarkers).forEach(e => {
        if (e.animFrame) cancelAnimationFrame(e.animFrame);
        markersGroup.removeLayer(e.marker);
      });
      vehicleMarkers  = {};
      vehicleRouteMap = {};
      markersByRoute  = {};
      busLines.clear();
      clearHighlight();
    }

    // ── Rörelse-lyssnare (debounce 400 ms) ──────────────────────
    map.on('moveend zoomend', () => {
      clearTimeout(moveDebounce);
      moveDebounce = setTimeout(fetchData, 400);
    });

    // ── Bootstrap med geolokalisering ───────────────────────────
    (function init() {
      info.update(null, false, true);

      // Hämta och visa versionen
      fetch('/api/version').then(r => r.json()).then(v => {
        const el = document.getElementById('versionBadge');
        if (el) el.textContent = `Version: ${v.version}`;
      }).catch(() => {});

      const INTERVAL = 15000;

      function scheduledFetch() {
        flashUpdateIndicator();
        nextFetchAt = Date.now() + INTERVAL;
        fetchData();
      }

      function startPolling() {
        nextFetchAt = Date.now() + INTERVAL;
        setInterval(scheduledFetch, INTERVAL);
      }

      if (!navigator.geolocation) {
        nextFetchAt = Date.now() + INTERVAL;
        fetchData();
        startPolling();
        return;
      }

      // Timeout: om geolok tar > 2 s, starta ändå med standardvy
      let started = false;
      const fallback = setTimeout(() => {
        if (!started) { started = true; nextFetchAt = Date.now() + INTERVAL; fetchData(); }
      }, 2000);

      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(fallback);
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
          if (!started) { started = true; nextFetchAt = Date.now() + INTERVAL; fetchData(); }
        },
        () => {
          clearTimeout(fallback);
          if (!started) { started = true; nextFetchAt = Date.now() + INTERVAL; fetchData(); }
        },
        { timeout: 8000, maximumAge: 60000 }
      );

      startPolling();
    })();
  </script>
</body>
</html>
