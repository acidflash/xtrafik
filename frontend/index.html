<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X-trafik Realtidskarta</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; }

    /* ── Leaflet controls ─────────────────────────────────────── */
    .info {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      border-radius: 5px;
    }
    .info h4 { margin: 0 0 5px; color: #777; }
    .legend { line-height: 18px; color: #555; }

    /* ── Bus markers ──────────────────────────────────────────── */
    .bus-icon-new { display: block; }
    .leaflet-zoom-animated { will-change: transform; }

    /* ── Filter panel ─────────────────────────────────────────── */
    .filter-control {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      border-radius: 5px;
      margin-bottom: 10px;
    }
    .filter-control input,
    .filter-control button { margin-top: 5px; }

    /* ── Layer control ────────────────────────────────────────── */
    .leaflet-control-layers {
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      border-radius: 5px !important;
      border: none !important;
    }
    .leaflet-control-layers-expanded {
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.9);
    }

    /* ── Update indicator ─────────────────────────────────────── */
    .update-indicator {
      font-size: 12px;
      color: #555;
      transition: background-color 200ms ease-out, color 200ms ease-out;
    }
    .update-indicator.flash {
      background: rgba(255, 250, 205, 0.9);
      color: #333;
    }

    /* ── Popup ────────────────────────────────────────────────── */
    .popup-wrapper { min-width: 200px; }
    .popup-header {
      margin: 0 0 8px;
      padding: 6px 8px;
      text-align: center;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
    }
    .popup-long-name {
      font-weight: 600;
      margin: 0 0 8px;
      font-size: 13px;
      color: #444;
    }
    .popup-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .popup-table td {
      padding: 3px 0;
      vertical-align: top;
    }
    .popup-table td:first-child {
      font-weight: 600;
      color: #555;
      padding-right: 12px;
      white-space: nowrap;
    }

    /* ── Accessibility ────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .update-indicator { transition: none; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([60.6749, 17.1413], 10);

    // ── Base map layers ──────────────────────────────────────────
    const baseMaps = {
      "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }),
      "OpenTopoMap": L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenTopoMap contributors'
      }),
      "Esri WorldImagery": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }),
      "CyclOSM": L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
        attribution: '&copy; CyclOSM contributors'
      })
    };

    const savedLayer = localStorage.getItem('preferredMapLayer') || "OpenStreetMap";
    baseMaps[savedLayer].addTo(map);

    const layerControl = L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);
    const layerTitle = document.createElement('div');
    layerTitle.innerHTML = '<h4 style="margin:0 0 5px 0;text-align:center;">Kartstilar</h4>';
    layerControl.getContainer().insertBefore(layerTitle, layerControl.getContainer().firstChild);

    map.on('baselayerchange', e => localStorage.setItem('preferredMapLayer', e.name));

    // ── State ────────────────────────────────────────────────────
    let markersGroup = L.layerGroup().addTo(map);
    let markersByRoute = {};
    let legend = L.control({ position: 'bottomright' });
    let activeFilter = '';
    let busLines = new Set();
    let initialMapViewSet = false;

    // ── Colour map (fallback när GTFS saknar färger) ─────────────
    const busColors = {
      '1':  '#00796B',
      '2':  '#D32F2F',
      '3':  '#7B1FA2',
      '4':  '#FBC02D',
      '10': '#1976D2',
      '11': '#388E3C',
      '12': '#F57C00',
      '15': '#5D4037',
      'default': '#1c65b0'
    };

    function getBusColor(busNumber, routeColor) {
      if (routeColor && routeColor.startsWith('#') && routeColor !== '#000000') return routeColor;
      return busColors[busNumber] || busColors['default'];
    }

    // ── Info panel ───────────────────────────────────────────────
    let info = L.control();
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info');
      this.update(0);
      return this._div;
    };
    info.update = function (count, filtered = false) {
      this._div.innerHTML = '<h4>X-trafik Realtid</h4>' +
        (count ? `${count} fordon visas` : 'Laddar fordon...') +
        (filtered ? ' (filtrerat)' : '');
    };
    info.addTo(map);

    // ── Filter control ───────────────────────────────────────────
    let filterControl = L.control({ position: 'topright' });
    filterControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'filter-control');
      div.innerHTML = `
        <h4>Filtrera efter linje</h4>
        <input type="text" id="lineFilter" placeholder="Linjenummer, t.ex. 1" />
        <button id="applyFilter">Filtrera</button>
        <button id="clearFilter">Rensa</button>
      `;
      return div;
    };
    filterControl.addTo(map);

    document.getElementById('applyFilter').addEventListener('click', () => {
      activeFilter = document.getElementById('lineFilter').value.trim();
      fetchData();
    });

    document.getElementById('clearFilter').addEventListener('click', () => {
      activeFilter = '';
      document.getElementById('lineFilter').value = '';
      fetchData();
    });

    // Enter-tangent aktiverar filter
    document.getElementById('lineFilter').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        activeFilter = e.target.value.trim();
        fetchData();
      }
    });

    document.querySelector('.filter-control').addEventListener('mousedown', e => e.stopPropagation());

    // ── Direction arrow ──────────────────────────────────────────
    function createDirectionMarker(lat, lon, bearing, color) {
      return L.marker([lat, lon], {
        icon: L.divIcon({
          html: `<div style="transform:rotate(${bearing}deg);width:20px;height:20px;">
            <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
              <path d="M10,2 L16,10 L10,18 L4,10 Z" fill="${color}" stroke="white" stroke-width="1" />
            </svg>
          </div>`,
          className: '',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        }),
        zIndexOffset: -1
      });
    }

    // ── Legend ───────────────────────────────────────────────────
    function updateLegend(busLinesSet) {
      if (legend._map) map.removeControl(legend);
      if (busLinesSet.size < 2) return;

      const routeColors = {};
      Object.keys(markersByRoute).forEach(route => {
        const marker = markersByRoute[route]?.[0];
        const colorMatch = (marker?.options?.icon?.options?.html || '').match(/background-color:\s*([^;]+);/);
        if (colorMatch) routeColors[route] = colorMatch[1].trim();
      });

      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info legend');
        div.innerHTML = '<h4>Busslinjer</h4>';
        busLinesSet.forEach(line => {
          const color = routeColors[line] || getBusColor(line);
          div.innerHTML += `
            <div style="display:flex;align-items:center;margin-bottom:5px;">
              <div style="position:relative;margin-right:10px;">
                <div style="width:24px;height:14px;background-color:${color};border:2px solid white;border-radius:4px;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>
                <div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:white;color:black;border:1px solid black;border-radius:8px;padding:0 4px;font-weight:bold;font-size:10px;text-align:center;">${line}</div>
              </div>
              Linje ${line}
            </div>`;
        });
        return div;
      };
      legend.addTo(map);
    }

    // ── Update indicator ─────────────────────────────────────────
    const updateIndicator = L.control({ position: 'bottomleft' });
    updateIndicator.onAdd = function () {
      const div = L.DomUtil.create('div', 'info update-indicator');
      div.textContent = 'Laddar...';
      return div;
    };
    updateIndicator.addTo(map);

    function flashUpdateIndicator() {
      const el = document.querySelector('.update-indicator');
      if (!el) return;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 800);
    }

    function setLastUpdatedTime() {
      const el = document.querySelector('.update-indicator');
      if (!el) return;
      const now = new Date().toLocaleTimeString('sv-SE', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      el.textContent = `Senast uppdaterad: ${now}`;
    }

    // ── Main fetch ───────────────────────────────────────────────
    async function fetchData() {
      try {
        markersGroup.clearLayers();
        busLines.clear();
        markersByRoute = {};

        const data = await fetch('/api/vehicles').then(r => r.json());

        // Klientsidans fallback för bussnummer när backend returnerar 'Okänt'
        const vehicles = data.map(entity => {
          const v = { ...entity };
          const vehicleId = entity.vehicle?.id;

          if (!vehicleId) {
            v.busNumber = v.busNumber || '?';
            return v;
          }

          // Steg 1: Direktmappning för kända problematiska fordon
          const directMap = { '9031021000557753': '55' };
          if (directMap[vehicleId]) {
            v.busNumber = directMap[vehicleId];
          } else if (entity.busNumber && entity.busNumber !== 'Okänt') {
            // Steg 2: Backend-värde (GTFS-uppslaget) – använd direkt
          } else if (vehicleId.length === 16) {
            // Steg 3: Extrahera från 16-siffrigt X-trafik fordons-ID
            const companyId = vehicleId.substring(6, 10);
            const companyMap = {
              '1000':'44','1001':'27','0005':'55','1002':'1','1003':'2',
              '1004':'3','1005':'4','1010':'10','1011':'11','1012':'12',
              '1015':'15','1020':'20','1030':'30','1041':'41','1042':'42',
              '1050':'50','0051':'51','0052':'52','0054':'54','0056':'56',
              '0057':'57','0058':'58','0059':'59'
            };
            if (companyMap[companyId]) {
              v.busNumber = companyMap[companyId];
            } else if (companyId.startsWith('00')) {
              const n = companyId.substring(2).replace(/^0+/, '');
              v.busNumber = (n && parseInt(n) > 0) ? n : '?';
            } else {
              v.busNumber = '?';
            }
          } else {
            v.busNumber = entity.busNumber || 'X';
          }

          return v;
        });

        // Prefix-matchning: "1" matchar linje 1, 10, 11, 12 …
        const filtered = activeFilter
          ? vehicles.filter(v =>
              v.busNumber?.startsWith(activeFilter) || v.routeId === activeFilter
            )
          : vehicles;

        info.update(filtered.length, activeFilter !== '');

        filtered.forEach(vehicle => {
          if (!vehicle.position) return;

          const { latitude: lat, longitude: lon, speed: speedMs = 0, bearing = 0 } = vehicle.position;
          const speedKmh = Math.round(speedMs * 3.6);
          const routeKey = vehicle.busNumber || 'okänd';

          if (!markersByRoute[routeKey]) markersByRoute[routeKey] = [];
          if (vehicle.busNumber) busLines.add(vehicle.busNumber);

          const busColor = getBusColor(vehicle.busNumber, vehicle.routeColor);
          const textColor = vehicle.routeTextColor || '#FFFFFF';

          // Tidsstämpel
          let tsValue;
          if (typeof vehicle.timestamp === 'number') {
            tsValue = vehicle.timestamp;
          } else if (vehicle.timestamp?.low !== undefined) {
            tsValue = vehicle.timestamp.low;
          } else {
            tsValue = Math.floor(Date.now() / 1000);
          }
          const timestamp = new Date(parseInt(tsValue) * 1000)
            .toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

          const displayNumber = vehicle.routeInfo?.shortName ||
            (vehicle.busNumber !== 'Okänt' ? vehicle.busNumber : null) ||
            'X-trafik';

          const speedText = speedKmh > 0 ? `${speedKmh} km/h` : 'Stillastående';

          // Popup – bara användarrelevanta fält
          let popup = `<div class="popup-wrapper">
            <div class="popup-header" style="background-color:${busColor};color:${textColor};">
              Linje ${displayNumber}
            </div>`;

          if (vehicle.routeLongName) {
            popup += `<p class="popup-long-name">${vehicle.routeLongName}</p>`;
          }

          popup += `<table class="popup-table">
            <tr><td>Hastighet</td><td>${speedText}</td></tr>
            <tr><td>Uppdaterad</td><td>${timestamp}</td></tr>`;

          if (vehicle.routeInfo?.agency) {
            popup += `<tr><td>Operatör</td><td>${vehicle.routeInfo.agency}</td></tr>`;
          }

          popup += `</table></div>`;

          // Bussikon
          const busIcon = L.divIcon({
            html: `
              <div style="position:relative;">
                <div style="width:40px;height:24px;background-color:${busColor};border:2px solid white;border-radius:6px;position:relative;box-shadow:0 0 5px rgba(0,0,0,0.5);">
                  <div style="position:absolute;width:6px;height:6px;border-radius:50%;background:#333;bottom:-3px;left:6px;"></div>
                  <div style="position:absolute;width:6px;height:6px;border-radius:50%;background:#333;bottom:-3px;right:6px;"></div>
                </div>
                <div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:white;color:black;border:2px solid black;border-radius:12px;padding:1px 6px;font-weight:bold;font-size:14px;z-index:1000;min-width:14px;text-align:center;box-shadow:0 0 4px rgba(0,0,0,0.8);">${displayNumber}</div>
              </div>`,
            className: 'bus-icon-new',
            iconSize: [40, 36],
            iconAnchor: [20, 12]
          });

          const marker = L.marker([lat, lon], { icon: busIcon, zIndexOffset: 1000 })
            .bindPopup(popup)
            .addTo(markersGroup);

          markersByRoute[routeKey].push(marker);

          if (speedKmh > 0 && bearing !== 0) {
            const arrow = createDirectionMarker(lat, lon, bearing, busColor).addTo(markersGroup);
            markersByRoute[routeKey].push(arrow);
          }
        });

        updateLegend(busLines);
        setLastUpdatedTime();

        if (filtered.length > 0 && !activeFilter && !initialMapViewSet) {
          const bounds = filtered
            .filter(v => v.position?.latitude && v.position?.longitude)
            .map(v => [v.position.latitude, v.position.longitude]);
          if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50] });
            initialMapViewSet = true;
          }
        }

      } catch (err) {
        info.update(0, false);
        info._div.innerHTML += '<br><span style="color:red;">Fel vid hämtning av data</span>';
      }
    }

    // ── Bootstrap ────────────────────────────────────────────────
    fetchData();

    setInterval(() => {
      flashUpdateIndicator();
      fetchData();
    }, 15000);
  </script>
</body>
</html>
